version: 1
project:
  title: FloridaView
  description: Earth observation education, data discovery, and applied geospatial learning for Florida.
  copyright: "2026 FloridaView"
  github: FloridaView/floridaview.github.io
  keywords:
    - Florida
    - Earth observation
    - remote sensing
    - LiDAR
    - geospatial education
    - AmericaView
  exclude:
    - _build
    - .cache
    - node_modules
    - templates
    - vendor
    - .DS_Store
    - "**.ipynb_checkpoints"
  static_files:
    - assets
    - downloads
  toc:
    - file: index.md
    - file: pages/mission.md
    - file: pages/pi.md
    - file: pages/data.md
    - file: pages/tutorials/index.md
      children:
        - file: pages/lidar-labs/index.md
          children:
            - file: pages/lidar-labs/lab-01.md
            - file: pages/lidar-labs/lab-02.md
            - file: pages/lidar-labs/lab-03.md
            - file: pages/lidar-labs/lab-04.md
            - file: pages/lidar-labs/lab-05.md
            - file: pages/lidar-labs/lab-06.md
            - file: pages/lidar-labs/lab-07.md
            - file: pages/lidar-labs/lab-08.md
            - file: pages/lidar-labs/lab-09.md
            - file: pages/lidar-labs/lab-10.md
        - file: pages/tutorials/resources.md
    - file: pages/software.md
    - file: pages/accessibility.md
    - file: pages/contact.md
site:
  title: FloridaView
  template: .cache/book-theme
  options:
    logo: assets/brand/floridaview-logo-header.png
    logo_dark: assets/brand/floridaview-logo-header.png
    logo_alt: FloridaView
    favicon: assets/brand/favicon.ico
    folders: true
    style: custom.css
  parts:
    footer: footer.md
    primary_sidebar_footer: sidebar-footer.md
  actions:
    - title: GitHub
      url: https://github.com/FloridaView/floridaview.github.io
    - title: AmericaView
      url: https://americaview.org/
